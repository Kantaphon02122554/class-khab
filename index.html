<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ตารางคะแนน ROV ศึกชิงสี</title>
<meta name="theme-color" content="#0c0c0a">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: sticky black header with yellow wordmark, level tabs, then scoreboard-style tables and match rows. Single dark look (school black + yellow). */
:root{
  --bg:#0c0c0a; --panel:#15150f; --panel2:#1c1c14; --line:#2e2d20;
  --ink:#f6f2e4; --mute:#a8a392; --y:#ffc400; --y-ink:#14130a; --bad:#ff7a6b; --ok:#8fe08f;
  --f-head:'Chakra Petch','Anuphan',system-ui,sans-serif; --f-body:'Anuphan',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;margin:0}
.wrap{max-width:880px;margin:0 auto}
h1,h2,h3{font-family:var(--f-head);margin:0;font-weight:600;text-wrap:balance}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}

.top{padding:28px 0 20px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-family:var(--f-head);font-weight:500;font-size:14px;color:var(--mute)}
h1{font-size:clamp(34px,8vw,56px);line-height:1.02;margin-top:8px}
h1 span{color:var(--y)}
.sub{color:var(--mute);margin-top:8px}
.adm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);padding:8px 16px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--y)}
.btn.pri{background:var(--y);color:var(--y-ink);border-color:var(--y)}
.btn[disabled]{opacity:.45;cursor:default}
.pill{font-size:12.5px;padding:4px 12px;border-radius:8px;border:1px solid var(--line);color:var(--mute)}
.pill.on{background:var(--y);color:var(--y-ink);border-color:var(--y);font-weight:600}

.notice{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:12px 16px;border-radius:12px;font-weight:500;margin-bottom:20px}
.notice textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--ink);min-height:64px;resize:vertical}

.sched{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;margin-bottom:24px}
.sched table{width:100%;border-collapse:collapse}
.sched th,.sched td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.sched th{font-family:var(--f-head);font-size:13px;color:var(--mute);font-weight:500}
.sched tr:last-child td{border-bottom:0}
.sched .d{font-family:var(--f-head);font-weight:600;white-space:nowrap}
.sched .r{color:var(--mute)}
.sched .scroll{overflow-x:auto}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 20px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 0;z-index:5}
.tab{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 4px;font-family:var(--f-head);font-weight:600;font-size:16px;text-align:center;min-width:0}
.tab[aria-selected="true"]{background:var(--y);color:var(--y-ink);border-color:var(--y)}
.tab small{display:block;font-family:var(--f-body);font-weight:500;font-size:12.5px;opacity:.75}

.sec{margin-top:32px}
.sec>h2{font-size:22px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec>h2 small{font-family:var(--f-body);font-weight:500;font-size:13.5px;color:var(--mute)}

.grp{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px}
@media(max-width:700px){.grp{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.card h3{font-size:15px;color:var(--mute);font-weight:600;padding:12px 16px 4px}
.tbl{overflow-x:auto}
table.st{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.st th{font-size:12px;color:var(--mute);font-weight:500;padding:8px 8px;text-align:center}
.st td{padding:8px 8px;text-align:center;border-top:1px solid var(--line)}
.st th:nth-child(2),.st td:nth-child(2){text-align:left}
.st td.pts{font-family:var(--f-head);font-weight:600;font-size:18px}
.rk{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;font-family:var(--f-head);font-weight:600;background:var(--panel2);color:var(--mute)}
tr.q .rk{background:var(--y);color:var(--y-ink)}
tr.q td.nm{font-weight:600}
.tie{font-size:11.5px;color:var(--bad);display:block}
.man{display:block;font-size:11.5px;color:var(--y)}
.btn.sm{padding:4px 8px;font-size:12.5px;margin-right:8px}
.tbin{width:44px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px;text-align:center}
.foot{padding:8px 16px 12px;font-size:12.5px;color:var(--mute)}

.chip{display:inline-block;width:4px;height:16px;border-radius:2px;margin-right:8px;flex:none}
.nmw{display:flex;align-items:center;min-width:0}
.nmw span.t{overflow-wrap:anywhere}

.rnd{margin-top:16px}
.rnd>h3{font-size:15px;color:var(--mute);margin-bottom:8px;font-weight:600}
.rnd>h3 b{color:var(--ink)}
.ml{display:grid;gap:8px}
.m{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;display:grid;grid-template-columns:70px 1fr;gap:8px 16px;align-items:center}
.m .when{font-family:var(--f-head);font-weight:600;line-height:1.25}
.m .when span{display:block;font-family:var(--f-body);font-weight:400;font-size:12.5px;color:var(--mute)}
.tl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0}
.tl.win{color:var(--y);font-weight:600}
.tl.lose{color:var(--mute)}
.tag{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--panel2);color:var(--mute);white-space:nowrap}
.tl.win .tag{background:var(--panel2);color:var(--y)}
.tag.ff{background:#3a1d18;color:var(--bad)}
.score{font-family:var(--f-head);font-weight:600;font-size:20px;min-width:20px;text-align:right}
.ctl{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:12px;align-items:center;border-top:1px dashed var(--line);padding-top:8px;font-size:13.5px}
.ctl select,.sc select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.ctl label{display:flex;gap:8px;align-items:center;color:var(--mute)}
.ph{color:var(--mute);font-style:italic}
.gtag{font-family:var(--f-head);font-size:12px;border:1px solid var(--line);border-radius:5px;padding:0 8px;color:var(--mute);margin-left:8px}

.champ{margin-top:16px;border-radius:16px;background:var(--y);color:var(--y-ink);padding:24px;text-align:center}
.champ small{font-family:var(--f-head);font-weight:600;font-size:15px}
.champ b{display:block;font-family:var(--f-head);font-size:clamp(28px,7vw,44px);line-height:1.1;margin-top:4px}

.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:12px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
@media(max-width:600px){.teams{grid-template-columns:1fr}}
.teams label{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--mute)}
.teams input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 8px}
.legend{display:flex;flex-wrap:wrap;gap:8px 20px;color:var(--mute);font-size:13.5px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--y);color:var(--y-ink);padding:12px 20px;border-radius:12px;font-weight:600;z-index:20}
.bar{position:sticky;bottom:0;display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--panel2);border:1px solid var(--y);border-radius:12px;padding:12px 16px;margin-top:24px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
@media(prefers-reduced-motion:no-preference){.btn,.tab{transition:background .15s,border-color .15s}}
.dlg{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:16px;z-index:30}
.dlgc{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;width:min(360px,100%);display:grid;gap:12px}
.dlgc label{color:var(--mute);font-size:13.5px}
.dlgc input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:16px}
.dmsg{min-height:20px;color:var(--bad);font-size:13.5px}
.drow{display:flex;gap:8px;justify-content:flex-end}
</style>
</head>
<body>

<div class="wrap">
  <div id="root"></div>
</div>
<script src="config.js"></script>
<script>
(function(){
const COLORS=[{k:'ฟ้า',full:'ฟ้าชิดชลธี',c:'#4fb3ff'},{k:'ม่วง',full:'ม่วงพบภูวดล',c:'#a77bff'},{k:'แดง',full:'อัคนีสีแดง',c:'#ff4d4d'},{k:'ชมพู',full:'วาโยแสงชมพู',c:'#ff7ac0'}];
const LV={
  ml:{name:'ชาย ม.ต้น',day:'จันทร์ 16 พ.ย.',fday:'ศุกร์ 20 พ.ย.',slot:0},
  fl:{name:'หญิง ม.ต้น',day:'จันทร์ 16 พ.ย.',fday:'พฤหัสบดี 19 พ.ย.',slot:1},
  xl:{name:'ผสม ม.ต้น',day:'พุธ 18 พ.ย.',fday:'จันทร์ 23 พ.ย.',slot:0},
  mh:{name:'ชาย ม.ปลาย',day:'อังคาร 17 พ.ย.',fday:'ศุกร์ 20 พ.ย.',slot:0},
  fh:{name:'หญิง ม.ปลาย',day:'อังคาร 17 พ.ย.',fday:'พฤหัสบดี 19 พ.ย.',slot:1},
  xh:{name:'ผสม ม.ปลาย',day:'พุธ 18 พ.ย.',fday:'จันทร์ 23 พ.ย.',slot:1}};
const GROUPS={A:['ฟ้า1','ม่วง1','แดง1','ชมพู1'],B:['ชมพู2','แดง2','ม่วง2','ฟ้า2']};
const ROUNDS=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
const GTS=[['15.00','15.50','16.40'],['15.25','16.15','17.05']], ST=['15.00','15.25','15.50'], FT=['16.15','16.40','17.05'];

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DEF_NOTICE='รอบแบ่งกลุ่ม ชายและหญิง ม.ต้น เริ่ม 16 พ.ย. เวลา 15.00 น. ที่ห้องโสต 2 ทีมที่ไม่มาภายใน 5 นาที ปรับแพ้';
const norm=d=>{const s=Object.assign({res:{},names:{},tb:{},ov:{},notice:DEF_NOTICE},d||{});['res','names','tb','ov'].forEach(k=>{s[k]=s[k]||{}});return s};
let S=norm();
let tab=(location.hash.slice(1) in LV)?location.hash.slice(1):'ml', edit=false, dirty=false, canEdit=false, pass='', ver=-1, loginOpen=false, loginMsg='', saving=false, toastMsg='';

const MATCHES=[];
for(const lv in LV){
  for(const g of ['A','B']) ROUNDS.forEach((pairs,ri)=>pairs.forEach((p,pi)=>MATCHES.push({
    id:`${lv}-${g}${ri+1}${pi+1}`,lv,stage:'g',g,r:ri+1,room:(g==='A'?0:2)+pi+1,
    a:`${lv}:${GROUPS[g][p[0]]}`,b:`${lv}:${GROUPS[g][p[1]]}`,time:GTS[LV[lv].slot][ri]})));
  MATCHES.push({id:`${lv}-SF1`,lv,stage:'s',n:1},{id:`${lv}-SF2`,lv,stage:'s',n:2},{id:`${lv}-F`,lv,stage:'f'});
}
const res=id=>S.res[id]||(S.res[id]={w:'',ff:0,sa:0,sb:0});
const label=id=>id.split(':')[1];
const tname=id=>S.names[id]||label(id).replace(/(\d)/,' $1');
const colorOf=id=>COLORS.find(c=>label(id).startsWith(c.k));
const chip=id=>`<i class="chip" style="background:${colorOf(id).c}"></i>`;
const tline=id=>`<span class="nmw">${chip(id)}<span class="t">${esc(tname(id))}</span></span>`;

function standings(lv,g){
  const ids=GROUPS[g].map(l=>`${lv}:${l}`);
  const ms=MATCHES.filter(m=>m.lv===lv&&m.g===g);
  const st={}; ids.forEach(i=>st[i]={id:i,p:0,w:0,l:0,pts:0});
  const won=m=>{const r=S.res[m.id];return r&&r.w?(r.w==='a'?m.a:m.b):null};
  ms.forEach(m=>{const w=won(m);if(!w)return;const l=w===m.a?m.b:m.a;st[w].p++;st[w].w++;st[w].pts+=3;st[l].p++;st[l].l++;});
  ids.forEach(i=>{const o=S.ov[i];if(!o)return;['p','w','l'].forEach(f=>{if(o[f]!=null)st[i][f]=o[f]});st[i].pts=st[i].w*3;st[i].man=true;});
  const arr=Object.values(st);
  arr.forEach(t=>{
    const tied=arr.filter(o=>o.pts===t.pts).map(o=>o.id);
    t.h=tied.length>1?ms.filter(m=>won(m)===t.id&&tied.includes(m.a)&&tied.includes(m.b)).length:0;
    const v=parseInt(S.tb[t.id],10); t.tb=isNaN(v)?null:v;
  });
  const cmp=(x,y)=>y.pts-x.pts||y.h-x.h||((x.tb??99)-(y.tb??99));
  arr.sort(cmp);
  arr.forEach((t,i)=>{t.rank=i+1;t.tie=(i>0&&cmp(arr[i-1],t)===0)||(i<arr.length-1&&cmp(t,arr[i+1])===0);});
  const done=ms.every(m=>won(m))||ids.every(i=>st[i].p>=3);
  return {rows:arr,done,clear:done&&!arr.slice(0,3).some(t=>t.tie)};
}
function serWin(id){const r=S.res[id];if(!r)return '';return r.sa>=2?'a':r.sb>=2?'b':''}
function resolve(m){
  const lv=m.lv;
  if(m.stage==='s'){
    const A=standings(lv,'A'),B=standings(lv,'B');
    const pick=(s,i)=>s.clear?s.rows[i].id:null;
    return m.n===1?{a:pick(A,0),b:pick(B,1),la:'ที่ 1 กลุ่ม A',lb:'ที่ 2 กลุ่ม B'}:{a:pick(B,0),b:pick(A,1),la:'ที่ 1 กลุ่ม B',lb:'ที่ 2 กลุ่ม A'};
  }
  const w=n=>{const sm=MATCHES.find(x=>x.id===`${lv}-SF${n}`);const t=resolve(sm);const k=serWin(sm.id);return k&&t[k]?t[k]:null};
  return {a:w(1),b:w(2),la:'ผู้ชนะรอบรอง 1',lb:'ผู้ชนะรอบรอง 2'};
}

function groupMatch(m){
  const r=S.res[m.id]||{};const w=r.w;
  const line=(id,side)=>{
    const cls=w===side?'win':(w?'lose':'');
    const tag=w===side?'ชนะ +3':(w?(r.ff?'<span class="tag ff">ไม่มา ปรับแพ้</span>':'<span class="tag">แพ้</span>'):'');
    return `<div class="tl ${cls}">${tline(id)}${w===side?'<span class="tag">ชนะ +3</span>':tag}</div>`;
  };
  let ctl='';
  if(edit){
    ctl=`<div class="ctl"><select data-a="w" data-m="${m.id}" aria-label="ผลการแข่ง">
      <option value="">ยังไม่แข่ง</option>
      <option value="a"${w==='a'?' selected':''}>${esc(tname(m.a))} ชนะ</option>
      <option value="b"${w==='b'?' selected':''}>${esc(tname(m.b))} ชนะ</option>
    </select><label><input type="checkbox" data-a="ff" data-m="${m.id}"${r.ff?' checked':''}${w?'':' disabled'}> ทีมแพ้ไม่มา (ปรับแพ้)</label></div>`;
  }
  return `<div class="m"><div class="when">${m.time}<span>ห้อง ${m.room}</span></div><div>${line(m.a,'a')}${line(m.b,'b')}</div>${ctl}</div>`;
}
function seriesMatch(m,title,times){
  const t=resolve(m), r=S.res[m.id]||{sa:0,sb:0}, win=serWin(m.id);
  const line=(id,lab,side)=>{
    const sc=side==='a'?r.sa||0:r.sb||0;
    return `<div class="tl ${win===side?'win':(win?'lose':'')}">${id?tline(id):`<span class="ph">${lab}</span>`}<span class="score">${id||sc?sc:'–'}</span></div>`;
  };
  let ctl='';
  if(edit){
    const opt=v=>[0,1,2].map(n=>`<option${n===(v||0)?' selected':''}>${n}</option>`).join('');
    ctl=`<div class="ctl sc"><span>เกมที่ชนะ</span>
      <label>${t.a?esc(tname(t.a)):'ทีม 1'} <select data-a="sa" data-m="${m.id}"${t.a&&t.b?'':' disabled'}>${opt(r.sa)}</select></label>
      <label>${t.b?esc(tname(t.b)):'ทีม 2'} <select data-a="sb" data-m="${m.id}"${t.a&&t.b?'':' disabled'}>${opt(r.sb)}</select></label></div>`;
  }
  return `<div class="m"><div class="when">${title}<span>Bo3 · ${times}</span></div><div>${line(t.a,t.la,'a')}${line(t.b,t.lb,'b')}</div>${ctl}</div>`;
}

function standTable(lv,g){
  const s=standings(lv,g);
  const rows=s.rows.map(t=>`<tr class="${s.done&&t.rank<=2&&!t.tie?'q':''}">
    <td><span class="rk">${t.rank}</span></td>
    <td class="nm">${tline(t.id)}${s.done&&t.tie?'<span class="tie">คะแนนเท่ากัน รอตัดสิน</span>':''}${edit&&t.man?'<span class="man">กรอกเอง</span>':''}</td>
    ${['p','w','l'].map(f=>edit?`<td><input class="tbin" type="number" min="0" max="9" inputmode="numeric" data-a="ov" data-f="${f}" data-t="${t.id}" value="${t[f]}" aria-label="${{p:'เล่น',w:'ชนะ',l:'แพ้'}[f]} ${esc(tname(t.id))}"></td>`:`<td>${t[f]}</td>`).join('')}<td class="pts">${t.pts}</td>
    ${edit?`<td><input class="tbin" type="number" min="1" max="4" inputmode="numeric" data-a="tb" data-t="${t.id}" value="${t.tb??''}" aria-label="ลำดับตัดสิน ${esc(tname(t.id))}"></td>`:''}</tr>`).join('');
  return `<div class="card"><h3>กลุ่ม ${g}</h3><div class="tbl"><table class="st">
    <tr><th>อันดับ</th><th>ทีม</th><th>เล่น</th><th>ชนะ</th><th>แพ้</th><th>คะแนน</th>${edit?'<th>ตัดสิน</th>':''}</tr>${rows}</table></div>
    <div class="foot">${edit&&s.rows.some(r=>r.man)?`<button class="btn sm" data-act="ovclear" data-lv="${lv}" data-g="${g}">ใช้ค่าจากผลแข่งแทน</button> `:''}${s.done?(s.clear?'จบรอบแบ่งกลุ่ม · ที่ 1–2 เข้ารอบรอง':'จบรอบแบ่งกลุ่ม · รอตัดสินอันดับที่เท่ากัน'):'ยังแข่งไม่ครบ 6 นัด'}</div></div>`;
}

function level(lv){
  const L=LV[lv];
  const groupRounds=[1,2,3].map(r=>`<div class="rnd"><h3><b>รอบ ${r}</b> · ${GTS[L.slot][r-1]} น.</h3><div class="ml">${
    MATCHES.filter(m=>m.lv===lv&&m.stage==='g'&&m.r===r).map(groupMatch).join('')}</div></div>`).join('');
  const sf=MATCHES.filter(m=>m.lv===lv&&m.stage==='s').map(m=>seriesMatch(m,`รอง ${m.n}`,ST.join(' · '))).join('');
  const fm=MATCHES.find(m=>m.lv===lv&&m.stage==='f');
  const ft=resolve(fm), fw=serWin(fm.id), champ=fw&&ft[fw]?ft[fw]:null;
  const nameEdit=edit?`<div class="sec"><h2>ชื่อทีม <small>ใส่ชื่อทีมจริงแทนค่าเริ่มต้น (เว้นว่าง = ใช้ชื่อสี)</small></h2><div class="teams">${
    ['A','B'].flatMap(g=>GROUPS[g]).map(l=>{const id=`${lv}:${l}`;return `<label>${chip(id)}<input data-a="name" data-t="${id}" value="${esc(S.names[id]||'')}" placeholder="${esc(label(id).replace(/(\d)/,' $1'))}" aria-label="ชื่อทีม ${esc(label(id))}"></label>`}).join('')}</div></div>`:'';
  return `<div class="sec"><h2>ตารางคะแนน <small>แข่ง ${L.day} · ชนะ 3 คะแนน แพ้ 0</small></h2><div class="grp">${standTable(lv,'A')}${standTable(lv,'B')}</div></div>
  <div class="sec"><h2>รอบแบ่งกลุ่ม <small>รอบละ 4 คู่พร้อมกัน ห้อง 1–2 กลุ่ม A ห้อง 3–4 กลุ่ม B · สลับรอบกับอีกประเภทของวัน</small></h2>${groupRounds}</div>
  <div class="sec"><h2>รอบรองชนะเลิศ <small>${L.fday} · 15.00 น. · แข่งพร้อมกันกับอีกรุ่น</small></h2><div class="ml" style="margin-top:12px">${sf}</div></div>
  <div class="sec"><h2>ชิงชนะเลิศ <small>${L.fday} · 16.15 น. · Bo3</small></h2><div class="ml" style="margin-top:12px">${seriesMatch(fm,'ชิง',FT.join(' · '))}</div>
    ${champ?`<div class="champ"><small>แชมป์ ROV ${L.name}</small><b>${esc(tname(champ))}</b></div>`:''}</div>${nameEdit}`;
}

function counts(lv){
  const ms=MATCHES.filter(m=>m.lv===lv);let d=0,t=0;
  ms.forEach(m=>{t++;const r=S.res[m.id];if(m.stage==='g'){if(r&&r.w)d++}else if(serWin(m.id))d++});
  return {d,t};
}

function render(){
  const adm=`<div class="adm">${dirty?'<span class="pill on">ยังไม่บันทึก</span>':''}${canEdit?`<button class="btn${edit?' pri':''}" data-act="edit">${edit?'ปิดโหมดแก้ไข':'แก้ไขผลแข่ง'}</button><button class="btn" data-act="logout">ออกจากโหมดผู้ดูแล</button>`:'<button class="btn" data-act="login">ผู้ดูแล</button>'}</div>`;
  $('#root').innerHTML=`
  <header class="top"><div><div class="eyebrow">E-sports · ห้องโสต 2 · 15.00–17.30 น.</div>
    <h1>ROV <span>ศึกชิงสี</span></h1><div class="sub">โรงเรียนท่าบ่อ · ตารางแข่งและคะแนน</div></div>${adm}</header>
  ${edit?`<div class="notice"><textarea data-a="notice" aria-label="ประกาศ">${esc(S.notice)}</textarea></div>`:(S.notice?`<div class="notice">${esc(S.notice)}</div>`:'')}
  <div class="sched"><div class="scroll"><table><tr><th>วันที่</th><th>ประเภท</th><th>รายการ</th></tr>
    <tr><td class="d">จ. 16 พ.ย.</td><td>ชาย ม.ต้น · หญิง ม.ต้น</td><td>รอบแบ่งกลุ่ม</td></tr>
    <tr><td class="d">อ. 17 พ.ย.</td><td>ชาย ม.ปลาย · หญิง ม.ปลาย</td><td>รอบแบ่งกลุ่ม</td></tr>
    <tr><td class="d">พ. 18 พ.ย.</td><td>ผสม ม.ต้น · ผสม ม.ปลาย</td><td>รอบแบ่งกลุ่ม</td></tr>
    <tr><td class="d">พฤ. 19 พ.ย.</td><td>หญิง ม.ต้น · ม.ปลาย</td><td>รอบรอง 15.00 · ชิง 16.15</td></tr>
    <tr><td class="d">ศ. 20 พ.ย.</td><td>ชาย ม.ต้น · ม.ปลาย</td><td>รอบรอง 15.00 · ชิง 16.15</td></tr>
    <tr><td class="d">จ. 23 พ.ย.</td><td>ผสม ม.ต้น · ม.ปลาย</td><td>รอบรอง 15.00 · ชิง 16.15</td></tr></table></div></div>
  <nav class="tabs" role="tablist">${Object.keys(LV).map(k=>{const c=counts(k);return `<button class="tab" role="tab" data-act="tab" data-v="${k}" aria-selected="${tab===k}">${LV[k].name}<small>แข่งแล้ว ${c.d}/${c.t}</small></button>`}).join('')}</nav>
  ${level(tab)}
  <div class="legend">${COLORS.map(c=>`<span class="nmw"><i class="chip" style="background:${c.c}"></i>${c.full}</span>`).join('')}</div>
  ${edit?`<div class="bar"><span>${dirty?'มีการแก้ไขที่ยังไม่ได้บันทึก':'ไม่มีการแก้ไขใหม่'}</span><span><button class="btn" data-act="discard"${dirty?'':' disabled'}>ยกเลิก</button> <button class="btn pri" data-act="save"${dirty&&!saving?'':' disabled'}>${saving?'กำลังบันทึก…':'บันทึกให้ทุกคนเห็น'}</button></span></div>`:''}
  ${toastMsg?`<div class="toast" role="status">${esc(toastMsg)}</div>`:''}
  ${loginOpen?`<div class="dlg"><form class="dlgc" id="lf"><h3>โหมดผู้ดูแล</h3><label for="pw">รหัสผู้ดูแล</label><input id="pw" type="password" autocomplete="off" autofocus><div class="dmsg">${esc(loginMsg)}</div><div class="drow"><button type="button" class="btn" data-act="loginclose">ยกเลิก</button><button class="btn pri">เข้าสู่ระบบ</button></div></form></div>`:''}`;
}
function toast(m){toastMsg=m;render();setTimeout(()=>{toastMsg='';render()},3500)}

$('#root').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='tab'){tab=b.dataset.v;try{history.replaceState(null,'','#'+tab)}catch(_){}render();}
  else if(a==='edit'){edit=!edit;render();}
  else if(a==='discard'){location.reload();}
  else if(a==='ovclear'){GROUPS[b.dataset.g].forEach(l=>delete S.ov[`${b.dataset.lv}:${l}`]);dirty=true;render();}
  else if(a==='save'){save();}
  else if(a==='login'){loginOpen=true;loginMsg='';render();const i=$('#pw');if(i)i.focus();}
  else if(a==='loginclose'){loginOpen=false;render();}
  else if(a==='logout'){pass='';canEdit=false;edit=false;try{sessionStorage.removeItem('rovp')}catch(_){}render();}
});
$('#root').addEventListener('submit',async e=>{
  if(e.target.id!=='lf')return;e.preventDefault();
  const v=$('#pw').value;if(!v)return;
  if(!hasDb){loginMsg='ยังไม่ได้ตั้งค่าฐานข้อมูล (config.js)';render();return}
  loginMsg='กำลังตรวจรหัส…';render();
  try{
    const r=await rpc('rov_login',{p_pass:v});
    if(r==='ok'){pass=v;canEdit=true;edit=true;loginOpen=false;try{sessionStorage.setItem('rovp',v)}catch(_){}await load(true);render();}
    else if(r==='locked'){loginMsg='ใส่รหัสผิดหลายครั้ง รอ 10 นาทีแล้วลองใหม่';render();}
    else{loginMsg='รหัสไม่ถูกต้อง';render();}
  }catch(err){loginMsg='เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง';render();}
});
$('#root').addEventListener('change',e=>{
  const t=e.target,a=t.dataset.a;if(!a)return;
  if(a==='w'){const r=res(t.dataset.m);r.w=t.value;if(!t.value)r.ff=0;}
  else if(a==='ff'){res(t.dataset.m).ff=t.checked?1:0;}
  else if(a==='sa'||a==='sb'){const r=res(t.dataset.m);r[a]=parseInt(t.value,10)||0;}
  else if(a==='name'){const v=t.value.trim();if(v)S.names[t.dataset.t]=v;else delete S.names[t.dataset.t];}
  else if(a==='ov'){const id=t.dataset.t,f=t.dataset.f,v=parseInt(t.value,10);S.ov[id]=S.ov[id]||{};if(isNaN(v))delete S.ov[id][f];else S.ov[id][f]=Math.max(0,v);if(!Object.keys(S.ov[id]).length)delete S.ov[id];}
  else if(a==='tb'){const v=t.value.trim();if(v)S.tb[t.dataset.t]=v;else delete S.tb[t.dataset.t];}
  else if(a==='notice'){S.notice=t.value.trim();}
  dirty=true;render();
});

const CFG=window.ROV_CONFIG||{};
const hasDb=!!(CFG.url&&CFG.key);
const H={apikey:CFG.key||'',Authorization:'Bearer '+(CFG.key||''),'Content-Type':'application/json'};
async function rpc(fn,body){
  const r=await fetch(CFG.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:H,body:JSON.stringify(body)});
  if(!r.ok)throw new Error('http '+r.status);
  return r.json();
}
async function load(force){
  if(!hasDb)return false;
  try{
    const r=await fetch(CFG.url+'/rest/v1/rov_state?id=eq.1&select=data,version',{headers:H,cache:'no-store'});
    if(!r.ok)return false;
    const row=(await r.json())[0];
    if(!row)return false;
    if(!force&&row.version===ver)return false;
    ver=row.version;S=norm(row.data);return true;
  }catch(_){return false}
}
async function save(){
  if(saving||!canEdit)return;
  saving=true;render();
  try{
    const r=await rpc('rov_save',{p_pass:pass,p_data:S,p_version:ver});
    saving=false;
    if(r.ok){ver=r.version;dirty=false;toast('บันทึกแล้ว ทุกคนเห็นผลใหม่');}
    else if(r.error==='conflict'){await load(true);dirty=false;toast('มีผู้ดูแลอีกคนบันทึกก่อน โหลดข้อมูลล่าสุดแล้ว');}
    else if(r.error==='bad'||r.error==='locked'){pass='';canEdit=false;edit=false;toast('รหัสไม่ถูกต้องหรือถูกล็อกชั่วคราว');}
    else toast('บันทึกไม่สำเร็จ ลองอีกครั้ง');
  }catch(_){saving=false;toast('บันทึกไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองอีกครั้ง');}
}

render();
load().then(c=>{if(c)render()});
setInterval(async()=>{if(document.hidden||dirty||edit||loginOpen)return;if(await load())render()},15000);
(async()=>{
  let p='';try{p=sessionStorage.getItem('rovp')||''}catch(_){}
  if(!p||!hasDb)return;
  try{if(await rpc('rov_login',{p_pass:p})==='ok'){pass=p;canEdit=true;render();}}catch(_){}
})();
})();
</script>
</body>
</html>
