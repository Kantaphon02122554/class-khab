<style>
:root{--bg:#f1f5f9;--surface:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--acc:#2563eb;--accsoft:#dbeafe}
html.dark{--bg:#0b1220;--surface:#111a2e;--line:#243152;--text:#e5ecf6;--muted:#93a1ba;--acc:#60a5fa;--accsoft:#1e3a8a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Anuphan',system-ui,sans-serif}
body{max-width:560px;margin:0 auto;padding:0 16px calc(24px + env(safe-area-inset-bottom));min-height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:14px 0 8px}
header a{color:var(--muted);text-decoration:none;font-size:14px;padding:6px 8px 6px 0}
h1{font-size:17px;font-weight:600;margin:0;flex:1}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);font:500 13px 'Anuphan';padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--acc);color:#fff}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#stage{position:relative;height:min(56dvh,460px);min-height:280px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg);touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.lab{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:500;color:var(--text);background:color-mix(in srgb,var(--surface) 86%,transparent);padding:1px 6px;border-radius:6px;pointer-events:none;white-space:nowrap}
.lab.sel{background:var(--acc);color:#fff}
.tools{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.tools button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:600 16px 'Anuphan';cursor:pointer}
.legend{position:absolute;left:8px;bottom:8px;font-size:11px;color:var(--muted);background:color-mix(in srgb,var(--surface) 88%,transparent);padding:3px 8px;border-radius:8px}
.go{display:block;width:100%;margin-top:12px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:600 15px 'Anuphan';padding:13px 14px;cursor:pointer}
.go:disabled{opacity:.55;cursor:default}
.card{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.55}
.card.acc{border-left:3px solid var(--acc)}
.card b{font-weight:600}
.muted{color:var(--muted)}
h2{font-size:14px;font-weight:600;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:5px 11px;font:500 13px 'Anuphan';cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.dim{opacity:.5}
.row{display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .p{width:74px;flex:none;color:var(--muted)}
#list details{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:8px;padding:2px 12px}
#list summary{padding:10px 0;font-weight:500;cursor:pointer}
.views{display:flex;gap:6px;margin-top:10px}
.views button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;font:500 13px 'Anuphan';padding:8px 6px;cursor:pointer}
.views button[aria-pressed="true"]{background:var(--accsoft);border-color:var(--acc);color:var(--text)}
#stage:fullscreen{height:100%;border-radius:0;border:0}
.hud{position:absolute;left:8px;top:8px;right:52px;display:flex;flex-direction:column;align-items:flex-start;gap:6px;pointer-events:none}
.pill{font-size:12px;background:color-mix(in srgb,var(--surface) 90%,transparent);color:var(--text);padding:4px 9px;border-radius:9px;line-height:1.4}
.pill.muted{color:var(--muted)}
#tgt{display:flex;align-items:center;gap:6px}
#tgt svg{width:16px;height:16px;flex:none;color:var(--acc)}
#joy{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border:2px solid color-mix(in srgb,var(--acc) 55%,transparent);border-radius:50%;pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:color-mix(in srgb,var(--acc) 70%,transparent)}
#cap{position:absolute;left:8px;right:8px;bottom:8px;display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--surface) 92%,transparent);border-radius:12px;padding:8px 8px 8px 12px}
#cap .t{flex:1;min-width:0}
#cap b{display:block;font-size:15px;font-weight:600}
#cap span{font-size:12px;color:var(--muted)}
#cap button{width:34px;height:34px;flex:none;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:600 15px 'Anuphan';cursor:pointer}
.tools svg{width:16px;height:16px;vertical-align:middle}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function select(keys, level) { sel = keys && keys.length ? { keys: keys, level: level == null ? null : level } : null; req(); updateList(); if (view === 'walk') setTarget(); }

// ===== แผงรายละเอียด =====
var out = $('out'), viewDay = 0, lastQuery = null, cache = {};

function dayStart() { var d = bkkNow().dow; return d >= 1 && d <= 5 ? d : 1; }

// ===== ปุ่ม "คาบถัดไปของฉันอยู่ที่ไหน" =====
$('where').onclick = function () {
  var btn = this, cls = myClass(), now = bkkNow();
  function say(title, text, extra) { var c = el('div', 'card acc'); c.appendChild(el('b', null, title)); if (text) c.appendChild(el('div', 'muted', text)); if (extra) c.appendChild(extra); out.replaceChildren(c); }
  if (!cls) { var a = el('a', null, 'ไปหน้าตาราง'); a.href = 'index.html'; a.style.color = 'var(--acc)'; say('ยังไม่ได้เลือกห้อง', 'เลือกห้องในหน้าตารางก่อน แล้วกลับมาที่นี่', a); return; }

    if (!loc) { select(null); say(head, it.subject + ' · ห้อง ' + it.room + ' · ยังไม่มีตำแหน่งของห้องนี้ในแผนที่'); return; }

};

// ===== โหมดรายการ (ทางสำรอง และสำหรับโปรแกรมอ่านจอ) =====

function updateList() { /* รายการไม่ไฮไลต์ ใช้การ์ดด้านบนแทน */ }
